<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#242A38" />
  <title>Manual of Me | TANG Onboarding</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="128x128" href="assets/favicon-tang-white.png?v=333" />
  <link rel="apple-touch-icon" href="assets/favicon-tang-white.png?v=333" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="topbar">
    <button class="brand" id="brandButton" type="button" aria-label="Go to home">
      <img src="assets/tang-logo-white.png" alt="TANG" />
      <span class="brand-copy">
        <strong>MANUAL OF ME</strong>
        <small>Brought to you by TANG Onboarding</small>
      </span>
    </button>
    <nav class="main-nav" aria-label="Primary">
      <button data-route="home" class="nav-btn active">Home</button>
      <button data-route="manual" class="nav-btn">Manual</button>
      <button data-route="onboarding" class="nav-btn">Onboarding</button>
      <button data-route="people" class="nav-btn">People</button>
      <button data-route="resources" class="nav-btn">Resources</button>
      <button data-route="examples" class="nav-btn">Examples</button>
    </nav>
    <div class="header-actions">
      <button id="tourButton" class="tour-button" type="button" aria-label="Take a quick tour of this tool"><span class="tour-play" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><circle cx="10" cy="10" r="8.4"></circle><path d="M8 6.8 13.2 10 8 13.2Z"></path></svg></span><span>Tour</span></button>
      <a class="site-link tang-edge-link" href="microsoft-edge:https://www.navsea.navy.mil/Resources/TANG/" title="Open the TANG website in Microsoft Edge">TANG website ↗</a>
      <button id="menuButton" class="menu-button" aria-expanded="false" aria-controls="mobileNav">Menu</button>
    </div>
  </header>
  <div class="mobile-nav" id="mobileNav" hidden>
    <button data-route="home">Home</button>
    <button data-route="manual">Manual</button>
    <button data-route="onboarding">Onboarding</button>
    <button data-route="people">People</button>
    <button data-route="resources">Resources</button>
    <button data-route="examples">Examples</button>
    <a class="tang-edge-link" href="microsoft-edge:https://www.navsea.navy.mil/Resources/TANG/" title="Open the TANG website in Microsoft Edge">TANG website ↗</a>
  </div>

  <button id="resourceChatbotLauncher" class="resource-chatbot-launcher" type="button" aria-label="Open the resource chatbot">
    <span class="resource-chatbot-launcher__icon">?</span>
    <span>Resources help</span>
  </button>

  <div id="resourceChatbot" class="resource-chatbot" aria-live="polite" aria-hidden="true">
    <div class="resource-chatbot__panel" role="dialog" aria-modal="false" aria-labelledby="resourceChatbotTitle">
      <div class="resource-chatbot__header">
        <div>
          <p class="resource-chatbot__eyebrow">TANG resource assistant</p>
          <h3 id="resourceChatbotTitle">Need a quick guide?</h3>
        </div>
        <button type="button" class="resource-chatbot__close" id="closeResourceChatbot" aria-label="Close chatbot">×</button>
      </div>

      <div class="resource-chatbot__body">
        <div class="resource-chatbot__message resource-chatbot__message--bot">I can help with onboarding, HCD basics, Navy context, tools, or where to start.</div>
        <div class="resource-chatbot__suggestions">
          <button type="button" class="resource-chatbot__suggestion" data-chat-question="What should I read first?">What should I read first?</button>
          <button type="button" class="resource-chatbot__suggestion" data-chat-question="Where do I start with Miro?">Where do I start with Miro?</button>
          <button type="button" class="resource-chatbot__suggestion" data-chat-question="What do I need to know about TANG culture?">What do I need to know about TANG culture?</button>
        </div>
      </div>

      <form class="resource-chatbot__composer" id="resourceChatbotForm">
        <input type="text" id="resourceChatbotInput" placeholder="Ask a resource question..." aria-label="Ask the resource chatbot" />
        <button type="submit" class="btn primary">Send</button>
      </form>
    </div>
  </div>

  <main id="app" tabindex="-1"></main>
  <div id="liveRegion" class="sr-only" aria-live="polite"></div>

  <input type="file" id="backupInput" accept="application/json" hidden />
  <script src="app.js"></script>
</body>
</html>
